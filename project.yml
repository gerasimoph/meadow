name: Meadow
options:
  bundleIdPrefix: io.github.gerasimoph
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 7BXWR5CPF2
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
packages:
  MeadowKit:
    path: Packages/MeadowKit
targets:
  Meadow:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: MeadowKit
      - target: MeadowQuickLook
        embed: true
        codeSign: true
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Meadow
        CFBundleDisplayName: Meadow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        CFBundleIconName: AppIcon
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes: [public.folder]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn]
              public.mime-type: [text/markdown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.gerasimoph.Meadow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ""
  MeadowQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - QuickLook/Sources
    dependencies:
      - package: MeadowKit
      - sdk: Quartz.framework
    info:
      path: QuickLook/Info.plist
      properties:
        CFBundleName: Meadow Quick Look
        CFBundleDisplayName: Meadow Quick Look
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportsSearchableItems: false
            QLSupportedContentTypes: [net.daringfireball.markdown]
    entitlements:
      path: QuickLook/QuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.gerasimoph.Meadow.QuickLook
schemes:
  Meadow:
    build:
      targets:
        Meadow: all
    run:
      config: Debug
    archive:
      config: Release
